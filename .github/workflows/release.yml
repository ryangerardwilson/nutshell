name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Check formatting, test and vet
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
      - name: Verify embedded version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go build -o "$RUNNER_TEMP/nutshell" .
          test "$("$RUNNER_TEMP/nutshell" --version)" = "nutshell ${RELEASE_TAG#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Nutshell $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
